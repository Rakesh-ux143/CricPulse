<!doctype html><html><head><meta charset="utf-8">
<title>CrickPulse Live Ticker</title>
<style>
  html,body{margin:0;padding:0;background:transparent;font-family:'Segoe UI',Arial,sans-serif;overflow:hidden;}
  #ticker{
    position:fixed;left:0;bottom:0;width:100%;
    display:flex;align-items:stretch;
    font-size:20px;color:#fff;
    box-sizing:border-box;
  }
  .hidden{display:none!important;}
  .block{
    background:rgba(10,14,24,0.92);
    padding:10px 18px;
    display:flex;align-items:center;gap:10px;
  }
  .live-badge{
    background:#e0263f;color:#fff;font-weight:800;font-size:14px;
    padding:4px 10px;border-radius:4px;letter-spacing:1px;
    animation:pulse 1.4s infinite;
  }
  @keyframes pulse{0%{opacity:1}50%{opacity:.55}100%{opacity:1}}
  .team-score{
    font-weight:800;font-size:26px;white-space:nowrap;
  }
  .overs-block{font-size:15px;color:#9fd3ff;white-space:nowrap;}
  .players{
    display:flex;flex-direction:column;justify-content:center;gap:2px;font-size:14px;
    border-left:2px solid rgba(255,255,255,.15);padding-left:14px;
  }
  .players .row{white-space:nowrap;}
  .players .label{color:#9fb0c8;font-size:11px;margin-right:6px;}
  .name{font-weight:700;}
  .bowler-figures{color:#ffd25c;}
  .chase{
    background:rgba(255,196,0,.15);color:#ffe08a;font-weight:700;
    padding:10px 18px;display:flex;align-items:center;white-space:nowrap;font-size:15px;
  }
  .overball-strip{
    display:flex;align-items:center;gap:6px;padding:10px 16px;flex:1;overflow:hidden;
  }
  .ball{
    min-width:26px;height:26px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:800;color:#fff;
    background:#3a4a63;flex-shrink:0;
  }
  .ball.b4{background:#1f8a3c;}
  .ball.b6{background:#1f6fe0;}
  .ball.bw{background:#c0223a;}
  .ball.bx{background:#c99b1c;}
  .ball.b0{background:#3a4a63;}
  .result-banner{
    position:fixed;left:0;bottom:0;width:100%;
    background:rgba(10,14,24,0.95);color:#ffd25c;
    font-size:26px;font-weight:800;text-align:center;padding:16px;
  }
  .brand{
    font-size:13px;color:#7fa7d8;letter-spacing:2px;position:absolute;top:-18px;left:18px;
  }
</style>
</head>
<body>

<div id="ticker" class="hidden">
  <div class="block">
    <div class="live-badge">● LIVE</div>
  </div>
  <div class="block">
    <div>
      <div class="team-score" id="teamScore">-- 0/0</div>
      <div class="overs-block" id="oversLine">0.0 overs</div>
    </div>
  </div>
  <div class="players">
    <div class="row"><span class="label">STRIKER</span><span class="name" id="strikerLine">-</span></div>
    <div class="row"><span class="label">NON-STRIKER</span><span id="nonStrikerLine">-</span></div>
    <div class="row"><span class="label">BOWLER</span><span class="name bowler-figures" id="bowlerLine">-</span></div>
  </div>
  <div class="chase hidden" id="chaseBlock"></div>
  <div class="overball-strip" id="overStrip"></div>
</div>

<div id="resultBanner" class="result-banner hidden"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<script>
// Usage: overlay.html?tid=YOUR_TOURNAMENT_ID
// Optional: &mid=SPECIFIC_MATCH_ID  (otherwise auto-picks the match with status "Live",
// falling back to the most recently completed one so the result banner can show)
const params = new URLSearchParams(location.search);
const tid = params.get("tid");
const fixedMid = params.get("mid");

if(!tid){
  document.body.innerHTML = "<div style='color:#fff;background:#c0223a;padding:14px;font-family:sans-serif'>Missing ?tid=TOURNAMENT_ID in the overlay URL.</div>";
  throw new Error("Missing tid");
}

const base = "tournaments/" + tid;
let teams = {};
let currentMatchRef = null;

function players(id){ return Object.values(teams[id]?.players||{}); }
function pname(teamId, playerId){ return players(teamId).find(p=>p.id===playerId)?.name || "-"; }
function overStr(balls){ return `${Math.floor((balls||0)/6)}.${(balls||0)%6}`; }

async function loadTeams(){
  const s = await db.ref(base+"/teams").once("value");
  teams = s.val() || {};
}

function pickMatch(matches){
  const entries = Object.values(matches||{});
  let live = entries.find(m=>m.status==="Live");
  if(live) return live;
  // fall back to most recently completed match (so result banner can display)
  const completed = entries.filter(m=>m.status==="completed");
  if(completed.length) return completed[completed.length-1];
  return null;
}

function watchMatches(){
  db.ref(base+"/matches").on("value", snap=>{
    const matches = snap.val() || {};
    const m = fixedMid ? matches[fixedMid] : pickMatch(matches);
    render(m);
  });
}

function bowlerFigures(m){
  const bowlerId = m.bowlerId;
  if(!bowlerId || !m.balls) return {overs:"0.0", runs:0, wkts:0};
  let legalBalls=0, runs=0, wkts=0;
  m.balls.forEach(b=>{
    if(b.bowlerId !== bowlerId) return;
    if(b.legal) legalBalls++;
    runs += b.runs||0;
    if(b.type==="wicket" && b.dismissal!=="Run Out") wkts++;
  });
  return { overs: overStr(legalBalls), runs, wkts };
}

function currentOverBalls(m){
  // Show the tail of the ball list, stopping at the start of the current over.
  if(!m.balls || !m.balls.length) return [];
  const legalInOver = (m.legalBalls||0) % 6;
  let count=0, out=[];
  for(let i=m.balls.length-1; i>=0; i--){
    out.unshift(m.balls[i]);
    if(m.balls[i].legal) count++;
    if(count >= (legalInOver===0 ? 6 : legalInOver) && m.balls[i].legal) break;
  }
  return out.slice(-8); // cap width
}

function ballBadge(b){
  if(b.type==="wicket") return {cls:"bw", txt:"W"};
  if(!b.legal) return {cls:"bx", txt:(b.type==="Wide"?"Wd":b.type==="No Ball"?"Nb":b.type==="Bye"?"B":"Lb")};
  if(b.runs===6) return {cls:"b6", txt:"6"};
  if(b.runs===4) return {cls:"b4", txt:"4"};
  return {cls:"b0", txt:String(b.runs)};
}

function render(m){
  const ticker = document.getElementById("ticker");
  const banner = document.getElementById("resultBanner");

  if(!m){
    ticker.classList.add("hidden");
    banner.classList.add("hidden");
    return;
  }

  if(m.status==="completed"){
    ticker.classList.add("hidden");
    banner.classList.remove("hidden");
    banner.textContent = "🏆 " + (m.result || "Match completed");
    return;
  }

  if(!m.inningsStarted){
    ticker.classList.add("hidden");
    banner.classList.add("hidden");
    return;
  }

  banner.classList.add("hidden");
  ticker.classList.remove("hidden");

  const battingName = m.battingTeamId===m.team1Id ? m.team1Name : m.team2Name;
  teamScore.textContent = `${battingName} ${m.runs||0}/${m.wickets||0}`;
  oversLine.textContent = `${overStr(m.legalBalls)} / ${m.overs||20} overs`;

  strikerLine.textContent = `${pname(m.battingTeamId, m.strikerId)}*`;
  nonStrikerLine.textContent = pname(m.battingTeamId, m.nonStrikerId);

  const bf = bowlerFigures(m);
  bowlerLine.textContent = `${pname(m.bowlingTeamId, m.bowlerId)}  ${bf.overs}-${bf.runs}-${bf.wkts}`;

  if(m.target){
    chaseBlock.classList.remove("hidden");
    const runsNeeded = Math.max(0, m.target - (m.runs||0));
    const ballsLeft = Math.max(0, (m.overs||20)*6 - (m.legalBalls||0));
    chaseBlock.textContent = runsNeeded ? `NEED ${runsNeeded} FROM ${ballsLeft} BALLS` : "TARGET REACHED";
  } else {
    chaseBlock.classList.add("hidden");
  }

  overStrip.innerHTML = currentOverBalls(m).map(b=>{
    const {cls,txt} = ballBadge(b);
    return `<div class="ball ${cls}">${txt}</div>`;
  }).join("");
}

loadTeams().then(watchMatches);
</script>
</body></html>
