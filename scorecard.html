<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Scorecard — Cricket Scorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Full Scorecard</div>
  <div id="scoreRoot"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<script src="assets/app.js"></script>
<script>
  renderNav("scorecard.html");

  const params = new URLSearchParams(window.location.search);
  const requestedId = params.get("id");

  function renderInnings(m, battingCard, bowlingCard, teamName, score, isCurrent) {
    const battingRows = Object.entries(battingCard || {})
      .map(([id, p]) => `
        <tr class="${isCurrent && id === m.strikerId ? "striker" : ""}">
          <td>${p.name}${isCurrent && id === m.strikerId ? " *" : ""}</td>
          <td>${p.out ? p.howOut : "not out"}</td>
          <td class="mono">${p.runs}</td>
          <td class="mono">${p.balls}</td>
          <td class="mono">${p.fours}</td>
          <td class="mono">${p.sixes}</td>
          <td class="mono">${strikeRate(p.runs, p.balls)}</td>
        </tr>`)
      .join("");
    const bowlingRows = Object.entries(bowlingCard || {})
      .map(([id, p]) => `
        <tr>
          <td>${p.name}</td>
          <td class="mono">${formatOvers(p.balls)}</td>
          <td class="mono">${p.runs}</td>
          <td class="mono">${p.wickets}</td>
          <td class="mono">${economy(p.runs, p.balls)}</td>
        </tr>`)
      .join("");
    return `
      <div class="panel">
        <h2 style="margin:0 0 4px;">${teamName} — ${score.runs}/${score.wickets} (${formatOvers(score.balls)} ov)</h2>
        <table>
          <thead><tr><th>Batter</th><th>Dismissal</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr></thead>
          <tbody>${battingRows}</tbody>
        </table>
      </div>
      <div class="panel">
        <h2 style="margin:0 0 4px;">Bowling</h2>
        <table>
          <thead><tr><th>Bowler</th><th>O</th><th>R</th><th>W</th><th>Econ</th></tr></thead>
          <tbody>${bowlingRows}</tbody>
        </table>
      </div>`;
  }

  function renderMatch(m) {
    const el = document.getElementById("scoreRoot");
    if (!m || !m.battingCard) {
      el.innerHTML = `<div class="panel"><span class="tag">No scorecard yet — start a match from the Admin Panel</span></div>`;
      return;
    }
    const battingName = m[m.battingTeam]?.name || "Batting";
    let html = `<div class="panel" style="text-align:center;">
        <span class="tag ${m.status === "live" ? "live" : "done"}">${m.status === "live" ? "LIVE" : m.status.replace("_", " ")}</span>
        <h1 style="margin:8px 0 0;font-size:24px;">${matchResultText(m)}</h1>
      </div>`;
    if (m.firstInnings) {
      html += `<div class="eyebrow" style="margin-top:10px;">Innings 1</div>` +
        renderInnings(m, m.firstInnings.battingCard, m.firstInnings.bowlingCard, m.firstInnings.teamName, m.firstInnings.score, false);
      html += `<div class="eyebrow" style="margin-top:10px;">Innings 2</div>` +
        renderInnings(m, m.battingCard, m.bowlingCard, battingName, m.score, true);
    } else {
      html += renderInnings(m, m.battingCard, m.bowlingCard, battingName, m.score, true);
    }
    el.innerHTML = html;
  }

  if (requestedId) {
    db.ref("matches/" + requestedId).on("value", (snap) => renderMatch(snap.val()));
  } else {
    watchCurrentMatch((m) => renderMatch(m));
  }
</script>
</body>
</html>
