<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scorecard</title><link rel="stylesheet" href="assets/style.css"></head><body><script src="assets/tournament-auth.js"></script><script>requireTournamentLogin()</script><header class="topbar"><div class="brand">📋 Scorecard</div><nav class="nav"><a class="btn" href="index.html">Home</a><a class="btn" href="live-score.html">Live Score</a><a class="btn" href="points-table.html">Points</a><button class="btn danger" onclick="logoutTournament()">🔒 Lock</button></nav></header><main class="container"><div class="card"><h2>Live Match Scorecards</h2><div id="list"></div></div></main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="assets/firebase-config.js"></script><script>const S=getTournamentSession();db.ref('tournaments/'+S.id+'/matches').on('value',s=>{const m=s.val()||{};list.innerHTML=Object.values(m).map(x=>`<div class="notice"><h2>${esc(x.team1Name)} vs ${esc(x.team2Name)}</h2><div class="score">${x.runs||0}/${x.wickets||0}</div><p>${esc(x.overs||'0.0')} overs · ${esc(x.status||'Live')}</p>${(x.commentary||[]).slice(-10).reverse().map(c=>'<div>'+esc(c)+'</div>').join('')}</div>`).join('')||'<p class="muted">No live matches.</p>'})</script></body></html>
