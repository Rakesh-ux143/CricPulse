<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scorecard</title><link rel="stylesheet" href="assets/style.css"></head><body>
<script src="assets/tournament-auth.js"></script><script>requireTournamentLogin()</script>
<header class="topbar"><div class="brand">📋 Scorecard</div><nav class="nav"><a class="btn" href="index.html">Dashboard</a><a class="btn" href="live-score.html">Live Score</a><a class="btn" href="points-table.html">Points</a><button class="btn danger" onclick="logoutTournament()">🔒 Logout</button></nav></header>
<main class="container"><div id="cards"></div></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="assets/firebase-config.js"></script>
<script>
const S=getTournamentSession();let teams={};
function pn(t,id){return Object.values(t?.players||{}).find(p=>p.id===id)?.name||"Unknown";}
async function render(){const s=await db.ref("tournaments/"+S.id+"/matches").once("value"),ms=s.val()||{};cards.innerHTML=Object.values(ms).map(m=>{const bt=teams[m.battingTeamId]||{},str=pn(bt,m.strikerId),non=pn(bt,m.nonStrikerId),ballsLeft=m.target?Math.max(0,(m.overs||20)*6-(m.legalBalls||0)):0,runsNeed=m.target?Math.max(0,m.target-(m.runs||0)):0;return `<div class="card"><h2>${esc(m.team1Name)} vs ${esc(m.team2Name)}</h2><div class="score">${m.runs||0}/${m.wickets||0}</div><p>${Math.floor((m.legalBalls||0)/6)}.${(m.legalBalls||0)%6} overs</p>${m.target?`<div class="needs">${runsNeed?`${runsNeed} RUNS NEEDED IN ${ballsLeft} BALLS`:"TARGET ACHIEVED"}</div>`:""}<h3>Current Batsmen</h3><div class="notice striker">${esc(str)}</div><div class="notice">${esc(non)}</div><h3>Commentary</h3><div class="commentary">${(m.commentary||[]).slice().reverse().map(c=>`<div class="notice">${esc(c)}</div>`).join("")}</div></div>`}).join("")||'<div class="card muted">No matches yet.</div>';}
db.ref("tournaments/"+S.id+"/teams").on("value",s=>{teams=s.val()||{};render();});db.ref("tournaments/"+S.id+"/matches").on("value",()=>render());
</script></body></html>
