<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CrickScore Admin</title>

  <link rel="stylesheet" href="assets/style.css">

  <style>
    .login-container {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      padding: 30px;
      border-radius: 15px;
      background: #101827;
      border: 1px solid #263246;
    }

    .login-box h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .login-box label {
      display: block;
      margin-bottom: 6px;
    }

    .login-box input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 8px;
      border: 1px solid #344056;
      background: #080d16;
      color: white;
      font-size: 16px;
    }

    .login-box button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .error {
      color: #ff7b7b;
      margin-top: 12px;
      text-align: center;
    }

    .success {
      color: #7ee2a8;
      margin-top: 12px;
      text-align: center;
    }

    .admin-container {
      max-width: 1200px;
      margin: auto;
      padding: 25px;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .admin-card {
      background: #101827;
      border: 1px solid #263246;
      border-radius: 12px;
      padding: 20px;
      margin-top: 20px;
    }

    .admin-btn {
      padding: 10px 15px;
      border-radius: 7px;
      border: 1px solid #f4c95d;
      background: #172131;
      color: #f4c95d;
      cursor: pointer;
      font-weight: bold;
    }

    .admin-btn.danger {
      border-color: #ff7777;
      color: #ff9999;
    }

    .team-item {
      background: #0b1320;
      padding: 15px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #263246;
    }
  </style>
</head>

<body>

<!-- =========================================================
     TOURNAMENT LOGIN
========================================================= -->

<div id="loginPage" class="login-container">

  <div class="login-box">

    <h1>🏏 CrickScore</h1>

    <p style="text-align:center;">
      Tournament Admin Access
    </p>

    <form id="loginForm">

      <label for="loginTournament">
        Tournament Name
      </label>

      <input
        id="loginTournament"
        type="text"
        placeholder="Example: RPL 2026"
        required
      >

      <label for="loginPassword">
        4-Digit Password
      </label>

      <input
        id="loginPassword"
        type="password"
        inputmode="numeric"
        maxlength="4"
        pattern="[0-9]{4}"
        placeholder="Example: 4826"
        required
      >

      <button class="admin-btn" type="submit">
        LOGIN
      </button>

    </form>

    <p id="loginMessage"></p>

    <hr style="margin:25px 0;border-color:#263246;">

    <button
      class="admin-btn"
      onclick="showCreateTournament()"
    >
      + CREATE TOURNAMENT
    </button>

  </div>

</div>


<!-- =========================================================
     CREATE TOURNAMENT
========================================================= -->

<div
  id="createTournamentPage"
  class="login-container"
  style="display:none;"
>

  <div class="login-box">

    <h1>Create Tournament</h1>

    <form id="createTournamentForm">

      <label>
        Tournament Name
      </label>

      <input
        id="newTournamentName"
        type="text"
        placeholder="Example: RPL 2026"
        required
      >

      <label>
        Create 4-Digit Password
      </label>

      <input
        id="newTournamentPassword"
        type="password"
        inputmode="numeric"
        maxlength="4"
        pattern="[0-9]{4}"
        placeholder="Example: 4826"
        required
      >

      <button
        type="submit"
        class="admin-btn"
      >
        CREATE TOURNAMENT
      </button>

    </form>

    <p id="createMessage"></p>

    <button
      class="admin-btn"
      onclick="showLogin()"
    >
      BACK TO LOGIN
    </button>

  </div>

</div>


<!-- =========================================================
     ADMIN PANEL
========================================================= -->

<div
  id="adminPage"
  class="admin-container"
  style="display:none;"
>

  <div class="admin-header">

    <div>
      <h1>🏏 CrickScore Admin</h1>

      <p>
        Tournament:
        <strong id="currentTournamentName"></strong>
      </p>

    </div>

    <button
      class="admin-btn danger"
      onclick="logoutTournament()"
    >
      LOCK / LOGOUT
    </button>

  </div>


  <!-- =====================================================
       TEAM MANAGEMENT
  ====================================================== -->

  <div class="admin-card">

    <h2>Teams</h2>

    <form id="teamForm">

      <label>Team Name</label>

      <input
        id="teamName"
        type="text"
        placeholder="Example: Bengaluru Strikers"
        required
      >

      <label>Short Name</label>

      <input
        id="teamShort"
        type="text"
        maxlength="5"
        placeholder="BS"
      >

      <br><br>

      <button
        type="submit"
        class="admin-btn"
      >
        + ADD TEAM
      </button>

    </form>

    <div id="teamsList"></div>

  </div>


  <!-- =====================================================
       QUICK LINKS
  ====================================================== -->

  <div class="admin-card">

    <h2>Tournament Management</h2>

    <button
      class="admin-btn"
      onclick="window.location.href='schedule.html'"
    >
      📅 SCHEDULE
    </button>

    <button
      class="admin-btn"
      onclick="window.location.href='points-table.html'"
    >
      🏆 POINTS TABLE
    </button>

    <button
      class="admin-btn"
      onclick="window.location.href='live-score.html'"
    >
      📺 LIVE SCORE
    </button>

  </div>

</div>


<!-- =========================================================
     FIREBASE
========================================================= -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script src="assets/firebase-config.js"></script>

<script src="assets/admin.js"></script>

</body>
</html>
