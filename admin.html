<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CrickPulse</title>

  <link rel="stylesheet" href="assets/style.css">
</head>

<body>

<div class="login-wrap">
  <div class="login-box">

    <h1>🏏 CrickPulse</h1>

    <p class="muted">
      Enter tournament name/User ID and 4-digit password.
    </p>

    <label for="name">Tournament Name / User ID</label>

    <input
      id="name"
      type="text"
      placeholder="Example: RPL 2026"
      autocomplete="off"
    >

    <label for="password">Password</label>

    <input
      id="password"
      type="password"
      placeholder="4-digit password"
      maxlength="4"
      inputmode="numeric"
      autocomplete="off"
    >

    <button
      id="createBtn"
      class="btn success"
      disabled
    >
      ＋ CREATE TOURNAMENT
    </button>

    <button
      id="loginBtn"
      class="btn"
      disabled
    >
      LOGIN
    </button>

    <p id="message"></p>

  </div>
</div>


<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script src="assets/firebase-config.js"></script>


<script>

const nameInput = document.getElementById("name");
const passwordInput = document.getElementById("password");

const createBtn = document.getElementById("createBtn");
const loginBtn = document.getElementById("loginBtn");

const message = document.getElementById("message");


/* ----------------------------------
   VALIDATE INPUT
---------------------------------- */

function validInput() {

  const name = nameInput.value.trim();
  const password = passwordInput.value.trim();

  return (
    name.length > 0 &&
    /^[0-9]{4}$/.test(password)
  );
}


/* ----------------------------------
   ENABLE / DISABLE BUTTONS
---------------------------------- */

function updateButtons() {

  const valid = validInput();

  createBtn.disabled = !valid;
  loginBtn.disabled = !valid;
}


nameInput.addEventListener("input", updateButtons);
passwordInput.addEventListener("input", updateButtons);


/* ----------------------------------
   SAVE SESSION
---------------------------------- */

function openDashboard(id, name) {

  sessionStorage.setItem(
    "crickpulseTournament",
    JSON.stringify({
      id: id,
      name: name
    })
  );

  /*
    Open dashboard.
  */

  window.location.href = "index.html";
}


/* ----------------------------------
   CREATE TOURNAMENT
---------------------------------- */

createBtn.addEventListener("click", async function () {

  const name = nameInput.value.trim();
  const password = passwordInput.value.trim();

  message.className = "";
  message.textContent = "Creating tournament...";

  createBtn.disabled = true;
  loginBtn.disabled = true;

  try {

    const snapshot =
      await db.ref("tournaments").once("value");

    const tournaments =
      snapshot.val() || {};


    /* Check duplicate name */

    const duplicate =
      Object.values(tournaments).some(tournament => {

        return (
          tournament &&
          String(tournament.name).toLowerCase() ===
          name.toLowerCase()
        );

      });


    if (duplicate) {

      message.className = "error";

      message.textContent =
        "This tournament already exists. Please use LOGIN.";

      updateButtons();

      return;
    }


    /* Generate unique ID */

    const tournamentId =
      "t_" +
      Date.now().toString(36) +
      Math.random().toString(36).substring(2, 8);


    /* Tournament data */

    const tournamentData = {

      id: tournamentId,

      name: name,

      password: password,

      createdAt: Date.now(),

      teams: {},

      players: {},

      schedules: {},

      matches: {},

      pointsTable: {}

    };


    /* Save tournament */

    await db
      .ref("tournaments/" + tournamentId)
      .set(tournamentData);


    message.textContent =
      "Tournament created successfully. Opening dashboard...";


    /*
      Save session and open dashboard.
    */

    openDashboard(tournamentId, name);

  }

  catch (error) {

    console.error("CREATE ERROR:", error);

    message.className = "error";

    message.textContent =
      "Unable to create tournament. Check Firebase configuration/rules.";

    updateButtons();
  }

});


/* ----------------------------------
   LOGIN TO EXISTING TOURNAMENT
---------------------------------- */

loginBtn.addEventListener("click", async function () {

  const name = nameInput.value.trim();
  const password = passwordInput.value.trim();

  message.className = "";
  message.textContent = "Checking tournament...";

  createBtn.disabled = true;
  loginBtn.disabled = true;

  try {

    const snapshot =
      await db.ref("tournaments").once("value");

    const tournaments =
      snapshot.val() || {};


    let foundTournament = null;


    for (const [id, tournament] of Object.entries(tournaments)) {

      if (!tournament) {
        continue;
      }


      const tournamentName =
        String(tournament.name || "").trim();


      const tournamentPassword =
        String(tournament.password || "").trim();


      if (
        tournamentName.toLowerCase() ===
        name.toLowerCase()
      ) {

        if (tournamentPassword === password) {

          foundTournament = {
            id: id,
            name: tournamentName
          };

        }

        break;
      }
    }


    /* Tournament not found */

    if (!foundTournament) {

      message.className = "error";

      message.textContent =
        "Tournament name or password is incorrect.";

      updateButtons();

      return;
    }


    /*
      Correct login.
      Save session.
    */

    sessionStorage.setItem(
      "crickpulseTournament",
      JSON.stringify(foundTournament)
    );


    message.textContent =
      "Login successful. Opening dashboard...";


    /* Open dashboard */

    window.location.href = "index.html";

  }

  catch (error) {

    console.error("LOGIN ERROR:", error);

    message.className = "error";

    message.textContent =
      "Firebase connection failed.";

    updateButtons();
  }

});


/* Initial state */

updateButtons();

</script>

</body>
</html>
