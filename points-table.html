<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Points Table — CrickScore</title>
<link rel="stylesheet" href="assets/style.css">
<style>
.table-wrap{overflow:auto}.points-table{width:100%;border-collapse:collapse;min-width:760px}
.points-table th,.points-table td{padding:10px;border-bottom:1px solid #263246;text-align:center}
.points-table th:first-child,.points-table td:first-child{text-align:left}.qualified{color:var(--gold);font-weight:700}
</style>
</head>
<body><div class="wrap">
<div class="eyebrow">League Standings</div><h1>Points Table</h1>
<div class="panel"><div class="muted">Win = 2 points · Tie/No Result = 1 · Loss = 0 · NRR = (runs scored / overs faced) − (runs conceded / overs bowled)</div></div>
<div id="pointsRoot"></div><div id="knockoutRoot"></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="assets/firebase-config.js"></script><script src="assets/app.js"></script>
<script>
if(typeof renderNav==="function")renderNav("points-table.html");

function calc(){
 db.ref("teams").once("value").then(ts=>{
  const teams=ts.val()||{};
  db.ref("matches").once("value").then(ms=>{
   const matches=ms.val()||{}, rows={};
   Object.entries(teams).forEach(([id,t])=>rows[id]={id,name:t.name,played:0,won:0,lost:0,tied:0,nr:0,points:0,rs:0,rf:0,os:0,of:0,nrr:0});
   Object.values(matches).forEach(m=>{
    if(m.status!=="completed"||!m.firstInnings)return;
    const a=m.teamA?.id,b=m.teamB?.id;if(!rows[a]||!rows[b])return;
    const first=m.firstInnings, second=m.score;
    // batting first = team indicated by firstInnings.teamName
    const firstId = m.teamA?.name===first.teamName ? a : b;
    const secondId = firstId===a?b:a;
    const fOvers=(first.score.balls||0)/6, sOvers=(second.balls||0)/6;
    rows[firstId].played++;rows[secondId].played++;
    rows[firstId].rs+=first.score.runs||0;rows[firstId].os+=fOvers;
    rows[secondId].rs+=second.runs||0;rows[secondId].os+=sOvers;
    rows[firstId].rf+=second.runs||0;rows[firstId].of+=sOvers;
    rows[secondId].rf+=first.score.runs||0;rows[secondId].of+=fOvers;
    let winner=null;
    if((second.runs||0)>=(m.target||Infinity)) winner=secondId;
    else if((first.score.runs||0)>(second.runs||0)) winner=firstId;
    if(winner){const loser=winner===a?b:a;rows[winner].won++;rows[loser].lost++;rows[winner].points+=2;}
    else {rows[a].tied++;rows[b].tied++;rows[a].points++;rows[b].points++;}
   });
   Object.values(rows).forEach(r=>r.nrr=(r.os&&r.of)?((r.rs/r.os)-(r.rf/r.of)):0);
   const list=Object.values(rows).sort((x,y)=>y.points-x.points||y.nrr-x.nrr);
   document.getElementById("pointsRoot").innerHTML=`<div class="panel table-wrap"><table class="points-table"><thead><tr>
   <th>Pos</th><th>Team</th><th>Mat</th><th>W</th><th>L</th><th>T/NR</th><th>Pts</th><th>NRR</th></tr></thead><tbody>`+
   list.map((r,i)=>`<tr class="${i<4?'qualified':''}"><td>${i+1}</td><td>${r.name}</td><td>${r.played}</td><td>${r.won}</td><td>${r.lost}</td><td>${r.tied}</td><td><b>${r.points}</b></td><td>${r.nrr>=0?"+":""}${r.nrr.toFixed(3)}</td></tr>`).join("")+
   `</tbody></table></div>`;
   const top=list.slice(0,4);
   document.getElementById("knockoutRoot").innerHTML=top.length>=4?`
   <div class="panel"><h2>Knockout Qualification</h2><p class="muted">Top 4 qualify automatically based on Points, then NRR.</p>
   <div class="grid-2">
    <div class="card"><b>Semifinal 1</b><p>${top[0].name} <span class="muted">vs</span> ${top[3].name}</p></div>
    <div class="card"><b>Semifinal 2</b><p>${top[1].name} <span class="muted">vs</span> ${top[2].name}</p></div>
   </div>
   <div class="card" style="margin-top:10px"><b>Final</b><p>Winner SF1 vs Winner SF2</p></div></div>`:'<div class="panel"><span class="tag">Need at least 4 teams for knockout bracket</span></div>';
  });
 });
}
calc();setInterval(calc,10000);
</script></body></html>
