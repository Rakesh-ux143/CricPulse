<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Points Table</title><link rel="stylesheet" href="assets/style.css"></head><body><script src="assets/tournament-auth.js"></script><script>requireTournamentLogin()</script><header class="topbar"><div class="brand">🏆 Points Table</div><nav class="nav"><a class="btn" href="index.html">Home</a><a class="btn" href="teams.html">Teams</a><a class="btn" href="schedule.html">Schedule</a><a class="btn" href="live-score.html">Live Score</a><button class="btn danger" onclick="logoutTournament()">🔒 Lock</button></nav></header><main class="container"><div class="card"><h2>League Points</h2><p class="muted">Win = 2 points, loss = 0. Teams are sorted by points and NRR.</p><div class="table-wrap"><table><thead><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>L</th><th>T</th><th>NRR</th><th>Pts</th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="assets/firebase-config.js"></script><script>const S=getTournamentSession(),B='tournaments/'+S.id;const od=o=>{const p=String(o||'0.0').split('.').map(Number);return(p[0]||0)+(p[1]||0)/6};async function load(){const T=(await db.ref(B+'/teams').once('value')).val()||{},M=(await db.ref(B+'/matches').once('value')).val()||{},R={};Object.entries(T).forEach(([id,t])=>R[id]={name:t.name,p:0,w:0,l:0,t:0,pts:0,fr:0,fo:0,ar:0,ao:0});Object.values(M).filter(m=>m.status==='Completed').forEach(m=>{let a=R[m.team1Id],b=R[m.team2Id];if(!a||!b)return;a.p++;b.p++;a.fr+=+m.team1Runs||0;b.fr+=+m.team2Runs||0;a.ar+=+m.team2Runs||0;b.ar+=+m.team1Runs||0;a.fo+=od(m.team1Overs);b.fo+=od(m.team2Overs);a.ao+=od(m.team2Overs);b.ao+=od(m.team1Overs);if(m.winnerId===m.team1Id){a.w++;b.l++;a.pts+=2}else if(m.winnerId===m.team2Id){b.w++;a.l++;b.pts+=2}else{a.t++;b.t++}});const A=Object.values(R).map(x=>({...x,nrr:(x.fo&&x.ao)?x.fr/x.fo-x.ar/x.ao:0})).sort((a,b)=>b.pts-a.pts||b.nrr-a.nrr);rows.innerHTML=A.map((x,i)=>`<tr><td>${i+1}</td><td><b>${esc(x.name)}</b></td><td>${x.p}</td><td>${x.w}</td><td>${x.l}</td><td>${x.t}</td><td>${x.nrr.toFixed(3)}</td><td><b>${x.pts}</b></td></tr>`).join('')||'<tr><td colspan="8">No teams.</td></tr>'}load()</script></body></html>
