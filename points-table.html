<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Points Table</title><link rel="stylesheet" href="assets/style.css"></head><body>
<script src="assets/tournament-auth.js"></script><script>requireTournamentLogin()</script>
<header class="topbar"><div class="brand">🏆 Points Table</div><nav class="nav"><a class="btn" href="index.html">Dashboard</a><a class="btn" href="schedule.html">Schedule</a><a class="btn" href="live-score.html">Live Score</a><button class="btn danger" onclick="logoutTournament()">🔒 Logout</button></nav></header>
<main class="container"><div class="card"><h2>League Points</h2><p class="muted">Win = 2 points. Ranking uses points first, then Net Run Rate.</p><div class="table-wrap"><table><thead><tr><th>#</th><th>Team</th><th>P</th><th>W</th><th>L</th><th>T</th><th>NRR</th><th>Pts</th></tr></thead><tbody id="rows"></tbody></table></div></div></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="assets/firebase-config.js"></script>
<script>
const S=getTournamentSession(),base="tournaments/"+S.id;
function oversToDecimal(v){if(!v)return 0;const [o,b]=String(v).split(".");return Number(o||0)+(Number(b||0)/6);}
async function load(){const [ts,ms]=await Promise.all([db.ref(base+"/teams").once("value"),db.ref(base+"/matches").once("value")]),teams=ts.val()||{},matches=ms.val()||{},r={};Object.entries(teams).forEach(([id,t])=>r[id]={name:t.name,p:0,w:0,l:0,t:0,pts:0,rf:0,ra:0,of:0,oa:0});
Object.values(matches).filter(m=>m.status==="Completed").forEach(m=>{const a=r[m.team1Id],b=r[m.team2Id];if(!a||!b)return;a.p++;b.p++;a.rf+=Number(m.team1Runs||0);b.rf+=Number(m.team2Runs||0);a.ra+=Number(m.team2Runs||0);b.ra+=Number(m.team1Runs||0);a.of+=oversToDecimal(m.team1Overs);b.of+=oversToDecimal(m.team2Overs);a.oa+=oversToDecimal(m.team2Overs);b.oa+=oversToDecimal(m.team1Overs);if(m.winnerId===m.team1Id){a.w++;b.l++;a.pts+=2}else if(m.winnerId===m.team2Id){b.w++;a.l++;b.pts+=2}else{a.t++;b.t++;}});
const arr=Object.values(r).map(x=>({...x,nrr:(x.of&&x.oa)?(x.rf/x.of-x.ra/x.oa):0})).sort((a,b)=>b.pts-a.pts||b.nrr-a.nrr);
rows.innerHTML=arr.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${x.p}</td><td>${x.w}</td><td>${x.l}</td><td>${x.t}</td><td>${x.nrr.toFixed(3)}</td><td><b>${x.pts}</b></td></tr>`).join("")||'<tr><td colspan="8">No completed league matches yet.</td></tr>';}
load();
</script></body></html>
