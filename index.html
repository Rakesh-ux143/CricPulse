<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CrickScore</title><link rel="stylesheet" href="assets/style.css"></head><body><script src="assets/tournament-auth.js"></script><script>requireTournamentLogin()</script><header class="topbar"><div class="brand">🏏 CrickScore <span id="tn"></span></div><nav class="nav"><a class="btn" href="index.html">Home</a><a class="btn" href="teams.html">Teams</a><a class="btn" href="schedule.html">Schedule</a><a class="btn" href="live-score.html">Live Score</a><a class="btn" href="scorecard.html">Scorecard</a><a class="btn" href="points-table.html">Points</a><button class="btn danger" onclick="logoutTournament()">🔒 Lock</button></nav></header><main class="container"><h1>Tournament Dashboard</h1><div class="grid"><div class="stat">Teams<b id="tc">0</b></div><div class="stat">Matches<b id="mc">0</b></div><div class="stat">Completed<b id="cc">0</b></div></div><div class="card"><h2>Admin Actions</h2><div class="actions"><a class="btn" href="teams.html">Manage Teams & Players</a><a class="btn" href="schedule.html">Create Schedule</a><a class="btn" href="live-score.html">Live Scoring</a><a class="btn" href="points-table.html">Points Table</a></div></div></main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="assets/firebase-config.js"></script><script>const s=getTournamentSession();document.getElementById('tn').textContent=s.name;db.ref('tournaments/'+s.id).on('value',x=>{const t=x.val()||{};tc.textContent=Object.keys(t.teams||{}).length;const m=Object.values(t.schedules||{});mc.textContent=m.length;cc.textContent=m.filter(x=>x.status==='Completed').length})</script></body></html>
