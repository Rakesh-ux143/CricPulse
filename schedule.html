<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Schedule</title><link rel="stylesheet" href="assets/style.css"></head><body>
<script src="assets/tournament-auth.js"></script><script>requireTournamentLogin()</script>
<header class="topbar"><div class="brand">📅 Match Schedule</div><nav class="nav"><a class="btn" href="index.html">Dashboard</a><a class="btn" href="teams.html">Teams</a><a class="btn" href="live-score.html">Live Score</a><a class="btn" href="points-table.html">Points</a><button class="btn danger" onclick="logoutTournament()">🔒 Logout</button></nav></header>
<main class="container"><div class="card"><h2>Schedule Match</h2><form id="scheduleForm" class="grid"><div><label>Team 1</label><select id="team1" required></select></div><div><label>Team 2</label><select id="team2" required></select></div><div><label>Date & Time</label><input id="matchDate" type="datetime-local" required></div><div><label>Overs</label><input id="overs" type="number" min="1" value="20" required></div><div><label>Venue</label><input id="venue"></div><div><label>Match Type</label><select id="matchType"><option>League</option><option>Qualifier</option><option>Eliminator</option><option>Final</option></select></div><div style="align-self:end"><button class="btn success">＋ ADD MATCH</button></div></form></div><div class="card"><h2>Scheduled Matches</h2><div class="table-wrap"><table><thead><tr><th>Match</th><th>Date</th><th>Overs</th><th>Type</th><th></th></tr></thead><tbody id="matchRows"></tbody></table></div></div></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="assets/firebase-config.js"></script>
<script>
const S=getTournamentSession(),base="tournaments/"+S.id,gen=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);let teams={};
async function loadTeams(){const s=await db.ref(base+"/teams").once("value");teams=s.val()||{};const html='<option value="">Select team</option>'+Object.entries(teams).map(([id,t])=>`<option value="${id}">${esc(t.name)}</option>`).join("");team1.innerHTML=team2.innerHTML=html;}
async function renderMatches(){const s=await db.ref(base+"/schedules").once("value"),ms=s.val()||{};matchRows.innerHTML=Object.entries(ms).map(([id,m])=>`<tr><td>${esc(m.team1Name)} vs ${esc(m.team2Name)}</td><td>${esc(m.date)}</td><td>${m.overs}</td><td>${esc(m.type)}</td><td><button class="btn danger" onclick="deleteMatch('${id}')">Delete</button></td></tr>`).join("")||'<tr><td colspan="5">No matches.</td></tr>'}
scheduleForm.onsubmit=async e=>{e.preventDefault();if(team1.value===team2.value)return alert("Select two different teams.");const id=gen(),m={id,team1Id:team1.value,team2Id:team2.value,team1Name:teams[team1.value].name,team2Name:teams[team2.value].name,date:matchDate.value,overs:Number(overs.value),venue:venue.value,type:matchType.value,status:"Scheduled"};await db.ref(base+"/schedules/"+id).set(m);await db.ref(base+"/matches/"+id).set({...m,status:"Not Started"});e.target.reset();renderMatches();}
window.deleteMatch=async id=>{if(confirm("Delete this match?")){await db.ref(base+"/schedules/"+id).remove();await db.ref(base+"/matches/"+id).remove();renderMatches();}};
loadTeams();renderMatches();
</script></body></html>
