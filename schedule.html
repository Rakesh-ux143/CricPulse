<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Schedule</title><link rel="stylesheet" href="assets/style.css"></head><body><script src="assets/tournament-auth.js"></script><script>requireTournamentLogin()</script><header class="topbar"><div class="brand">📅 Schedule</div><nav class="nav"><a class="btn" href="index.html">Home</a><a class="btn" href="teams.html">Teams</a><a class="btn" href="live-score.html">Live Score</a><a class="btn" href="points-table.html">Points</a><button class="btn danger" onclick="logoutTournament()">🔒 Lock</button></nav></header><main class="container"><div class="card"><h2>Create Match</h2><form id="sf" class="grid"><div><label>Team 1</label><select id="a" required></select></div><div><label>Team 2</label><select id="b" required></select></div><div><label>Date & Time</label><input id="dt" type="datetime-local" required></div><div><label>Venue</label><input id="venue"></div><div><label>Match Type</label><select id="type"><option>League</option><option>Qualifier</option><option>Eliminator</option><option>Final</option></select></div><div style="align-self:end"><button class="btn success">＋ ADD MATCH</button></div></form></div><div class="card"><h2>Fixtures</h2><div class="table-wrap"><table><thead><tr><th>Match</th><th>Date</th><th>Venue</th><th>Type</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div></main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="assets/firebase-config.js"></script><script>const S=getTournamentSession(),B='tournaments/'+S.id,gen=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);let T={};async function teams(){T=(await db.ref(B+'/teams').once('value')).val()||{};a.innerHTML=b.innerHTML='<option value="">Select team</option>';Object.entries(T).forEach(([id,t])=>{a.innerHTML+=`<option value="${id}">${esc(t.name)}</option>`;b.innerHTML+=`<option value="${id}">${esc(t.name)}</option>`})}async function load(){const m=(await db.ref(B+'/schedules').once('value')).val()||{};rows.innerHTML=Object.entries(m).map(([id,x])=>`<tr><td>${esc(x.team1Name)} vs ${esc(x.team2Name)}</td><td>${esc(x.date)}</td><td>${esc(x.venue)}</td><td>${esc(x.type)}</td><td>${esc(x.status)}</td><td><button class="btn danger" onclick="del('${id}')">Delete</button></td></tr>`).join('')||'<tr><td colspan="6">No matches.</td></tr>'}sf.onsubmit=async e=>{e.preventDefault();if(a.value===b.value)return alert('Select two different teams.');const id=gen(),x={id,team1Id:a.value,team2Id:b.value,team1Name:T[a.value].name,team2Name:T[b.value].name,date:dt.value,venue:venue.value,type:type.value,status:'Scheduled'};await db.ref(B+'/schedules/'+id).set(x);e.target.reset();load()};window.del=async id=>{if(confirm('Delete match?')){await db.ref(B+'/schedules/'+id).remove();load()}};teams();load();</script></body></html>
