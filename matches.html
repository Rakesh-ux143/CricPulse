<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Matches — Cricket Scorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
<div class="wrap">
  <div class="eyebrow">Matches</div>
  <h1 style="margin:0 0 16px;font-size:32px;">Live &amp; Past Matches</h1>

  <div id="liveSection"></div>

  <h2 style="font-size:18px;margin-top:24px;">Match History</h2>
  <div id="historySection"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="assets/firebase-config.js"></script>
<script src="assets/app.js"></script>
<script>
  renderNav("matches.html");

  // Live / in-progress match banner — updates automatically as admin scores
  watchCurrentMatch((m, id) => {
    const el = document.getElementById("liveSection");
    if (!m || m.status === "setup" || m.status === "completed" || m.status === "abandoned") {
      el.innerHTML = "";
      return;
    }
    const battingName = m[m.battingTeam]?.name || "Batting";
    el.innerHTML = `
      <a href="live-score.html" class="panel scoreboard" style="display:block;">
        <span class="tag live"><span class="live-dot"></span>LIVE NOW</span>
        <div class="team-names" style="margin-top:8px;">${battingName}</div>
        <div class="score-big mono">${m.score?.runs ?? 0}/${m.score?.wickets ?? 0}</div>
        <div class="overs">Overs ${formatOvers(m.score?.balls ?? 0)} ${m.target ? `· ${matchResultText(m)}` : ""}</div>
      </a>`;
  });

  // Full match history — every match ever created, most recent first
  db.ref("matches").on("value", (snap) => {
    const all = snap.val() || {};
    const el = document.getElementById("historySection");
    const list = Object.entries(all)
      .filter(([id, m]) => m.status === "completed" || m.status === "abandoned")
      .sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));

    if (list.length === 0) {
      el.innerHTML = `<div class="panel"><span class="tag">No completed matches yet</span></div>`;
      return;
    }

    el.innerHTML = list.map(([id, m]) => {
      const teamA = m.teamA?.name || "Team A";
      const teamB = m.teamB?.name || "Team B";
      const date = m.createdAt ? new Date(m.createdAt).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }) : "";
      return `
        <a href="scorecard.html?id=${id}" class="panel" style="display:block;">
          <div class="muted" style="font-size:12px;">${date}</div>
          <div class="team-names" style="margin:4px 0;">${teamA} vs ${teamB}</div>
          <div class="mono" style="color:var(--gold);">${matchResultText(m)}</div>
        </a>`;
    }).join("");
  });
</script>
</body>
</html>
