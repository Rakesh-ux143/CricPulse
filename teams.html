<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teams & Players</title><link rel="stylesheet" href="assets/style.css"></head><body>
<script src="assets/tournament-auth.js"></script><script>requireTournamentLogin()</script>
<header class="topbar"><div class="brand">👥 Teams & Players</div><nav class="nav"><a class="btn" href="index.html">Dashboard</a><a class="btn" href="schedule.html">Schedule</a><a class="btn" href="points-table.html">Points</a><button class="btn danger" onclick="logoutTournament()">🔒 Logout</button></nav></header>
<main class="container"><div class="card"><h2>Add Team</h2><form id="teamForm" class="grid"><div><label>Team Name</label><input id="teamName" required></div><div><label>Short Name</label><input id="shortName" maxlength="5"></div><div style="align-self:end"><button class="btn success">＋ ADD TEAM</button></div></form></div><div id="teamsList"></div></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="assets/firebase-config.js"></script>
<script>
const S=getTournamentSession(),base="tournaments/"+S.id,gen=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
async function renderTeams(){const s=await db.ref(base+"/teams").once("value"),ts=s.val()||{};teamsList.innerHTML=Object.entries(ts).sort((a,b)=>(a[1].number||0)-(b[1].number||0)).map(([id,t])=>`<div class="card"><h2>Team ${t.number}: ${esc(t.name)}</h2><p class="muted">${esc(t.shortName||"")}</p><div class="actions"><button class="btn" onclick="addPlayer('${id}')">＋ ADD PLAYER</button><button class="btn" onclick="editTeam('${id}')">Edit</button><button class="btn danger" onclick="deleteTeam('${id}')">Delete</button></div>${Object.entries(t.players||{}).map(([pid,p])=>`<div class="notice player-row"><span><b>${esc(p.name)}</b><br><span class="small">${esc(p.role)} · ${esc(p.battingStyle)} · ${esc(p.bowlingStyle)} · WK: ${p.wicketkeeper?"Yes":"No"}</span></span><button class="btn danger" onclick="deletePlayer('${id}','${pid}')">Delete</button></div>`).join("")}</div>`).join("")||'<div class="card muted">No teams yet.</div>'}
teamForm.onsubmit=async e=>{e.preventDefault();const s=await db.ref(base+"/teams").once("value"),ts=s.val()||{},id=gen();await db.ref(base+"/teams/"+id).set({id,number:Object.keys(ts).length+1,name:teamName.value.trim(),shortName:shortName.value.trim().toUpperCase(),players:{}});e.target.reset();renderTeams();};
window.editTeam=async id=>{const s=await db.ref(base+"/teams/"+id).once("value"),t=s.val(),n=prompt("Team name",t.name);if(n)await db.ref(base+"/teams/"+id).update({name:n.trim()});renderTeams();};
window.deleteTeam=async id=>{if(confirm("Delete this team and all its players?")){await db.ref(base+"/teams/"+id).remove();renderTeams();}};
window.addPlayer=async tid=>{const name=prompt("Player name");if(!name)return;const role=prompt("Role: Batsman / Bowler / All-Rounder / WK","Batsman");const batting=prompt("Batting: Right Hand / Left Hand","Right Hand");const bowling=prompt("Bowling: Fast / Medium Fast / Medium / Spin / None","None");const wk=confirm("Is wicketkeeper?");const pid=gen();await db.ref(base+"/teams/"+tid+"/players/"+pid).set({id:pid,name:name.trim(),role:role||"Batsman",battingStyle:batting||"",bowlingStyle:bowling||"None",wicketkeeper:wk});renderTeams();};
window.deletePlayer=async(t,p)=>{if(confirm("Delete this player?")){await db.ref(base+"/teams/"+t+"/players/"+p).remove();renderTeams();}};
renderTeams();
</script></body></html>
