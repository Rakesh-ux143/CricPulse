<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teams</title><link rel="stylesheet" href="assets/style.css"></head><body><script src="assets/tournament-auth.js"></script><script>requireTournamentLogin()</script><header class="topbar"><div class="brand">🏏 Teams</div><nav class="nav"><a class="btn" href="index.html">Home</a><a class="btn" href="schedule.html">Schedule</a><a class="btn" href="points-table.html">Points</a><button class="btn danger" onclick="logoutTournament()">🔒 Lock</button></nav></header><main class="container"><div class="card"><h2>Add Team</h2><form id="tf" class="grid"><div><label>Team Name</label><input id="name" required></div><div><label>Short Name</label><input id="short" maxlength="5"></div><div style="align-self:end"><button class="btn success">＋ ADD TEAM</button></div></form></div><div id="list"></div></main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="assets/firebase-config.js"></script><script>
const S=getTournamentSession(),B='tournaments/'+S.id,gen=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);async function load(){const all=(await db.ref(B+'/teams').once('value')).val()||{};list.innerHTML=Object.entries(all).sort((a,b)=>(a[1].number||0)-(b[1].number||0)).map(([id,t])=>`<div class="card"><h2>Team ${t.number}: ${esc(t.name)}</h2><p>${esc(t.shortName||'')}</p><div class="actions"><button class="btn" onclick="addPlayer('${id}')">＋ Player</button><button class="btn" onclick="editTeam('${id}')">Edit</button><button class="btn danger" onclick="delTeam('${id}')">Delete</button></div>${Object.entries(t.players||{}).map(([pid,p])=>`<div class="notice"><b>${esc(p.name)}</b> — ${esc(p.role)} · ${esc(p.batting)} · ${esc(p.bowling)} · WK: ${p.wicketkeeper?'Yes':'No'} <button class="btn danger" style="float:right" onclick="delPlayer('${id}','${pid}')">Delete</button></div>`).join('')}</div>`).join('')||'<div class="card muted">No teams added.</div>'}tf.onsubmit=async e=>{e.preventDefault();const all=(await db.ref(B+'/teams').once('value')).val()||{},id=gen();await db.ref(B+'/teams/'+id).set({id,number:Object.keys(all).length+1,name:name.value.trim(),shortName:short.value.trim().toUpperCase(),players:{}});e.target.reset();load()};window.editTeam=async id=>{const t=(await db.ref(B+'/teams/'+id).once('value')).val(),n=prompt('Team name',t.name),s=prompt('Short name',t.shortName||'');if(n)await db.ref(B+'/teams/'+id).update({name:n.trim(),shortName:(s||'').trim().toUpperCase()});load()};window.delTeam=async id=>{if(confirm('Delete team?')){await db.ref(B+'/teams/'+id).remove();load()}};window.addPlayer=async tid=>{const n=prompt('Player name');if(!n)return;const role=prompt('Role: Batsman / Bowler / All-Rounder / WK','Batsman'),bat=prompt('Batting: Right Hand / Left Hand','Right Hand'),bowl=prompt('Bowling: Fast / Medium Fast / Medium / Spin / None','None'),wk=confirm('Is wicketkeeper?'),pid=gen();await db.ref(B+'/teams/'+tid+'/players/'+pid).set({id:pid,name:n.trim(),role:role||'Batsman',batting:bat||'',bowling:bowl||'',wicketkeeper:wk});load()};window.delPlayer=async(tid,pid)=>{if(confirm('Delete player?')){await db.ref(B+'/teams/'+tid+'/players/'+pid).remove();load()}};load();</script></body></html>
