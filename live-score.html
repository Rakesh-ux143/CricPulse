<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Scoring</title><link rel="stylesheet" href="assets/style.css"></head><body><script src="assets/tournament-auth.js"></script><script>requireTournamentLogin()</script><header class="topbar"><div class="brand">🏏 Live Scoring</div><nav class="nav"><a class="btn" href="index.html">Home</a><a class="btn" href="schedule.html">Schedule</a><a class="btn" href="scorecard.html">Scorecard</a><a class="btn" href="points-table.html">Points</a><button class="btn danger" onclick="logoutTournament()">🔒 Lock</button></nav></header><main class="container"><div class="card"><label>Select Match</label><select id="ms"><option value="">Select match</option></select></div><div id="area" class="hidden"><div class="card"><h2 id="teams"></h2><div class="score" id="sc">0/0</div><p id="ov">0.0 overs</p></div><div class="card"><h3>Ball Result</h3><div class="ball-buttons"><button onclick="add(0)">DOT</button><button onclick="add(1)">1</button><button onclick="add(2)">2</button><button onclick="add(3)">3</button><button onclick="add(4)">FOUR</button><button onclick="add(6)">SIX</button><button onclick="extra('wide')">WIDE</button><button onclick="extra('no ball')">NO BALL</button><button onclick="extra('bye')">BYE</button><button onclick="extra('leg bye')">LEG BYE</button><button onclick="out()">WICKET</button><button onclick="revert()">↩ REVERT</button></div></div><div class="grid"><div class="card"><label>Ball Area</label><select id="ballArea"><option>Cover</option><option>Point</option><option>Mid-off</option><option>Mid-on</option><option>Straight</option><option>Square Leg</option><option>Fine Leg</option><option>Third Man</option><option>Deep Mid-wicket</option></select></div><div class="card"><label>Shot</label><select id="shot"><option>Defence</option><option>Drive</option><option>Cut</option><option>Pull</option><option>Hook</option><option>Sweep</option><option>Flick</option><option>Lofted Drive</option></select></div></div><div class="card"><h3>Commentary</h3><div id="comm" class="commentary"></div></div></div></main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="assets/firebase-config.js"></script><script>
const S=getTournamentSession(),B='tournaments/'+S.id;let M=null,H=[];async function matches(){const x=(await db.ref(B+'/schedules').once('value')).val()||{};ms.innerHTML='<option value="">Select match</option>'+Object.entries(x).map(([id,m])=>`<option value="${id}">${esc(m.team1Name)} vs ${esc(m.team2Name)} — ${esc(m.date||'')}</option>`).join('')}async function openMatch(){if(!ms.value)return area.classList.add('hidden');const snap=await db.ref(B+'/matches/'+ms.value).once('value');M=snap.val();if(!M){const m=(await db.ref(B+'/schedules/'+ms.value).once('value')).val();M={id:ms.value,team1Id:m.team1Id,team2Id:m.team2Id,team1Name:m.team1Name,team2Name:m.team2Name,runs:0,wickets:0,balls:0,overs:'0.0',history:[],commentary:[],status:'Live'};await db.ref(B+'/matches/'+M.id).set(M)}H=M.history||[];render()}ms.onchange=openMatch;function render(){area.classList.remove('hidden');teams.textContent=M.team1Name+' vs '+M.team2Name;sc.textContent=(M.runs||0)+'/'+(M.wickets||0);ov.textContent=(M.overs||'0.0')+' overs';comm.innerHTML=(M.commentary||[]).slice().reverse().map(x=>'<div>'+esc(x)+'</div>').join('')}async function save(text,legal=true){H.push(JSON.stringify(M));if(legal)M.balls=(M.balls||0)+1;M.overs=Math.floor((M.balls||0)/6)+'.'+((M.balls||0)%6);M.commentary=M.commentary||[];M.commentary.push(text);M.history=H;await db.ref(B+'/matches/'+M.id).set(M);render()}window.add=async r=>{M.runs=(M.runs||0)+r;const t=r===6?'💥 SIX! Massive hit!':r===4?'🏏 FOUR! Beautiful boundary!':r===0?'Dot ball. Good bowling.':`${r} run${r===1?'':'s'} through ${ballArea.value}.`;await save(t)};window.extra=async x=>{H.push(JSON.stringify(M));M.runs=(M.runs||0)+1;M.commentary=M.commentary||[];M.commentary.push(x==='wide'?'Wide — 1 extra.':x==='no ball'?'No ball — 1 extra.':x==='bye'?'Bye — run completed without bat.':'Leg-bye — run completed off the body.');M.history=H;await db.ref(B+'/matches/'+M.id).set(M);render()};window.out=async()=>{M.wickets=(M.wickets||0)+1;await save('WICKET! Select the new batsman and wicket details.',true)};window.revert=async()=>{if(!H.length)return alert('Nothing to revert.');M=JSON.parse(H.pop());M.history=H;await db.ref(B+'/matches/'+M.id).set(M);render()};matches();</script></body></html>
